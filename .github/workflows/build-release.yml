name: Build Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select build ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=$(git tag --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Build extension
        run: bash build.sh

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ref.outputs.ref }}
          name: ${{ steps.ref.outputs.ref }}
          generate_release_notes: true
          files: |
            safesearch-lock-for-youtube-chromium.zip
            safesearch-lock-for-youtube-firefox.zip

      - name: Update existing Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ steps.ref.outputs.ref }}" \
            safesearch-lock-for-youtube-chromium.zip \
            safesearch-lock-for-youtube-firefox.zip \
            --clobber